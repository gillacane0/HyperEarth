[project]
name = "hyperearth"
version = "0.1.0"
description = "Hyper-spectral's data models benchmark"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.4",
    "pandas>=2.2.3",
    "scipy>=1.11.4",
    "matplotlib>=3.8.4",
    "seaborn>=0.13.2",
    "scikit-learn>=1.5.0",
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "pytorch-lightning>=2.4.0",
    "xarray>=2024.0.0",
    "rioxarray>=0.16.0",
    "optuna>=3.7.0",
    "mlflow>=2.16.0",
    "hydra-core>=1.3.2",
    "pytest>=8.1.1",
    "pytest-cov>=5.0.0",
    "kagglehub>=1.0.2",
    "rasterio>=1.5.2",
]

# Makes src/hyperearth an installable package, so `import hyperearth` works from anywhere
[build-system]
requires = ["uv_build>=0.11.25,<0.12"]
build-backend = "uv_build"

# PyTorch with CUDA 13.0 (GPU) on Windows/Linux; macOS keeps the default PyPI build
[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
